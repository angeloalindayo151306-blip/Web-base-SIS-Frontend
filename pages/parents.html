<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Parents</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>
<link href="../css/admin.css" rel="stylesheet" />
<link href="../css/theme.css" rel="stylesheet" />

</head>

<body>

<!-- ✅ SIDEBAR -->
<div class="sidebar">
  <h4 class="text-center py-3">SIS Admin</h4>
  <a href="../dashboard.html">Dashboard</a>
  <a href="users.html">User Management</a>

  <hr />
  <div class="menu-title">Academic Structure</div>
  <a href="departments.html">Departments</a>
  <a href="courses.html">Courses</a>
  <a href="subjects.html">Subjects</a>
  <a href="subject-offerings.html">Subject Offerings</a>
  <a href="enrollments.html">Enrollments</a>

  <hr />
  <div class="menu-title">Academic Records</div>
  <a href="parents.html" class="active">Parents</a>
  <a href="grades.html">Grades</a>

  <hr />
  <a href="#" class="text-danger" onclick="logout()">Logout</a>
</div>

<!-- ✅ MAIN CONTENT -->
<div class="main-content">

  <div class="topbar">
    <h5>Parents Management</h5>
  </div>

  <div class="container-fluid mt-4">

    <!-- ✅ Search -->
    <div class="mb-3">
      <input
        type="text"
        id="parentSearch"
        class="form-control w-50"
        placeholder="Search parents..."
      />
    </div>

    <!-- ✅ Parent Table -->
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Linked Students</th>
          <th width="120">Actions</th>
        </tr>
      </thead>
      <tbody id="parentTable"></tbody>
    </table>

  </div>

</div>

<!-- ✅ LINK STUDENTS MODAL -->
<div class="modal fade" id="parentLinkModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Link Students to Parent</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <select id="parentStudentsSelect" multiple class="form-select"></select>
        <small class="text-muted">
          Hold CTRL (or CMD) to select multiple students.
        </small>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveParentLinks()">Save</button>
      </div>

    </div>
  </div>
</div>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ Core Scripts -->
<script src="../js/core/config.js"></script>
<script src="../js/core/api.js"></script>
<script src="../js/core/auth.js"></script>

<!-- ✅ Parent Logic -->
<script src="../js/modules/parents.js"></script>

</body>
</html>
