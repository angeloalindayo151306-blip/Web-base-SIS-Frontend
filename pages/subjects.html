<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Subjects</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Admin CSS -->
    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
  </head>

  <body>
    <!-- ✅ SIDEBAR -->
    <div class="sidebar">
      <h4 class="text-center py-3">SIS Admin</h4>

      <a href="../dashboard.html">Dashboard</a>
      <a href="users.html">User Management</a>

      <hr />

      <div class="menu-title">Academic Structure</div>
      <a href="departments.html">Departments</a>
      <a href="courses.html">Courses</a>
      <a href="subjects.html" class="active">Subjects</a>
      <a href="subject-offerings.html">Subject Offerings</a>
      <a href="enrollments.html">Enrollments</a>

      <hr />

      <div class="menu-title">Academic Records</div>
      <a href="parents.html">Parents</a>
      <a href="grades.html">Grades</a>

      <hr />

      <a href="#" class="text-danger" onclick="logout()">Logout</a>
    </div>

    <!-- ✅ MAIN CONTENT -->
    <div class="main-content">
      <div class="topbar">
        <h5>Subjects Management</h5>
      </div>

      <div class="container-fluid mt-4">
        <button class="btn btn-success mb-3" onclick="openAddModal()">
          + Add Subject
        </button>

        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>Subject</th>
              <th>Course</th>
              <th>Department</th>
              <th width="120">Actions</th>
            </tr>
          </thead>
          <tbody id="subjectTable"></tbody>
        </table>
      </div>
    </div>

    <!-- ✅ MODAL -->
    <div class="modal fade" id="subjectModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Subject</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label>Subject Name</label>
              <input id="subjectName" class="form-control" />
            </div>

            <div class="mb-3">
              <label>Course</label>
              <select id="subjectCourse" class="form-select"></select>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary" onclick="saveSubject()">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ Bootstrap JS MUST BE FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ✅ Core Scripts -->
    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>

    <!-- ✅ Subjects Script LAST -->
    <script src="../js/modules/subjects.js"></script>
  </body>
</html>
