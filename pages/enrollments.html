<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Enrollments</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Admin CSS -->
    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
  </head>

  <body>
    <!-- ✅ SIDEBAR -->
    <div class="sidebar">
      <h4 class="text-center py-3">SIS Admin</h4>

      <a href="../dashboard.html">Dashboard</a>
      <a href="users.html">User Management</a>

      <hr />

      <div class="menu-title">Academic Structure</div>
      <a href="departments.html">Departments</a>
      <a href="courses.html">Courses</a>
      <a href="subjects.html">Subjects</a>
      <a href="subject-offerings.html">Subject Offerings</a>
      <a href="enrollments.html" class="active">Enrollments</a>

      <hr />

      <div class="menu-title">Academic Records</div>
      <a href="parents.html">Parents</a>
      <a href="grades.html">Grades</a>

      <hr />
      <a href="#" class="text-danger" onclick="logout()">Logout</a>
    </div>

    <!-- ✅ MAIN CONTENT -->
    <div class="main-content">
      <!-- ✅ TOPBAR -->
      <div class="topbar">
        <h5>Enrollments</h5>
      </div>

      <div class="container-fluid mt-4">
        <!-- Enroll Button -->
        <button class="btn btn-primary mb-3" onclick="openEnrollmentModal()">
          + Enroll Student
        </button>

        <!-- Enrollment Table -->
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark text-center">
            <tr>
              <th class="text-start">Student</th>
              <th>Department</th>
              <th>Semester</th>
              <th width="120">Actions</th>
            </tr>
          </thead>
          <tbody id="enrollmentTableBody"></tbody>
        </table>

    <!-- ✅ ENROLLMENT MODAL -->
    <div class="modal fade" id="enrollmentModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Enroll Student</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label>Student</label>
              <select id="enrollmentStudent" class="form-control"></select>
            </div>

            <div class="mb-3">
              <label>Course</label>
              <select id="enrollmentCourse" class="form-control"></select>
            </div>

            <div class="mb-3">
              <label>Year Level</label>
              <select id="enrollmentYearLevel" class="form-control">
                <option value="">Select Year Level</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div>

            <div class="mb-3">
              <label>Semester</label>
              <select id="enrollmentSemester" class="form-control">
                <option value="">Select Semester</option>
                <option value="1">1</option>
                <option value="2">2</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary" onclick="saveEnrollment()">
              Enroll
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/rbac.js"></script>
    <script src="../js/core/sidebar.js"></script>

    <script src="../js/modules/enrollments.js"></script>
  </body>
</html>
