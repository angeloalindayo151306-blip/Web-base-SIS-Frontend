<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>

    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ✅ ROLE PROTECTION -->
    <script>
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user || user.role !== 'student') {
        alert('Access denied');
        window.location.href = '../index.html';
      }
    </script>

    <!-- ✅ Sidebar -->
    <div class="sidebar">
      <h4 class="text-center py-3">Student Panel</h4>
      <a href="student-dashboard.html" class="nav-link active">Dashboard</a>
      <a href="student-grades.html" class="nav-link">My Grades</a>
      <a href="student-attendance.html" class="nav-link">My Attendance</a>
      <hr />
      <a href="#" onclick="logout()" class="nav-link text-danger">Logout</a>
    </div>

    <!-- ✅ Main Content -->
    <div class="main-content">
      <div class="topbar d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Student Dashboard</h5>
      </div>

      <div class="container-fluid mt-4">
        <div class="row g-4">
          <!-- ✅ PROFILE CARD -->
          <div class="col-lg-4">
            <div class="card shadow-sm border-0 p-4 text-center h-100">
              <div class="mb-3">
                <div
                  class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center mx-auto"
                  style="width: 100px; height: 100px; font-size: 40px"
                >
                  <span id="studentInitial"></span>
                </div>
              </div>

              <h4 id="studentName" class="mb-1"></h4>
              <p class="text-muted mb-2" id="studentEmail"></p>

              <span class="badge bg-secondary mb-2">Student</span>

              <div id="gpaBadge" class="mt-2"></div>
            </div>
          </div>

          <!-- ✅ SUMMARY CARDS -->
          <div class="col-lg-8">
            <div class="row g-4">
              <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4 text-center">
                  <h6 class="text-muted">Total Subjects</h6>
                  <h3 id="totalSubjects" class="fw-bold">0</h3>
                </div>
              </div>

              <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4 text-center">
                  <h6 class="text-muted">Average Grade</h6>
                  <h3 id="averageGrade" class="fw-bold">0.00</h3>
                </div>
              </div>

              <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4 text-center">
                  <h6 class="text-muted">GPA (4.0 Scale)</h6>
                  <h3 id="gpaValue" class="fw-bold">0.00</h3>
                </div>
              </div>

              <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4 text-center">
                  <h6 class="text-muted">Attendance</h6>
                  <h3 id="attendancePercent" class="fw-bold">0%</h3>
                </div>
              </div>
            </div>

            <!-- ✅ Attendance Progress Bar -->
            <div class="card shadow-sm border-0 p-4 mt-4">
              <h6 class="mb-3">Attendance Overview</h6>
              <div class="progress" style="height: 10px">
                <div
                  id="attendanceBar"
                  class="progress-bar bg-success"
                  style="width: 0%"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ✅ Core Scripts -->
    <script src="../js/core/config.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/sidebar.js"></script>

    <!-- ✅ Module Script -->
    <script src="../js/modules/studentDashboard.js"></script>
  </body>
</html>
