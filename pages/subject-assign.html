<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Assign Students to Subject</title>
    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="sidebar">
      <h4 class="text-center py-3">SIS Admin</h4>
      <a href="../dashboard.html">Dashboard</a>
      <a href="subjects.html">Subjects</a>
      <a href="subject-assign.html" class="active">Assign Students</a>
      <hr />
      <a href="#" onclick="logout()">Logout</a>
    </div>

    <div class="main-content">
      <div class="topbar">
        <h5>Assign Students to Subject</h5>
      </div>

      <div class="container-fluid mt-4">
        <div class="mb-3">
          <label>Select Subject</label>
          <select id="assignSubjectSelect" class="form-control"></select>
        </div>

        <div class="mb-3">
          <label>Select Students</label>
          <select
            id="assignStudentSelect"
            class="form-control"
            multiple
          ></select>
        </div>

        <button class="btn btn-primary" onclick="assignStudents()">
          Assign
        </button>
      </div>
    </div>

    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/modules/subjectAssign.js"></script>
  </body>
</html>
