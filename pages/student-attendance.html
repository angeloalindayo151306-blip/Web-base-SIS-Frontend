<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Attendance</title>

    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <script>
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user || user.role !== 'student') {
        alert('Access denied');
        window.location.href = '../index.html';
      }
    </script>

    <div class="sidebar">
      <h4 class="text-center py-3">Student Panel</h4>
      <a href="student-dashboard.html" class="nav-link">Dashboard</a>
      <a href="student-grades.html" class="nav-link">My Grades</a>
      <a href="student-attendance.html" class="nav-link">My Attendance</a>
      <hr />
      <a href="#" onclick="logout()" class="nav-link text-danger">Logout</a>
    </div>

    <div class="main-content">
      <div class="topbar">
        <h5>My Attendance</h5>
      </div>

      <div class="container-fluid mt-4">
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>Subject</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="attendanceTableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="../js/core/config.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/sidebar.js"></script>
    <script src="../js/modules/studentAttendance.js"></script>
  </body>
</html>
