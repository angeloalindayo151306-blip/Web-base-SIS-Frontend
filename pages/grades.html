<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Grades</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Admin CSS -->
    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
  </head>

  <body>
    <!-- ■ SIDEBAR -->
    <div class="sidebar">
      <h4 class="text-center py-3">SIS Admin</h4>

      <!-- DASHBOARD -->
      <a href="../dashboard.html">Dashboard</a>

      <!-- USER MANAGEMENT -->
      <a href="users.html">User Management</a>
      <hr />

      <!-- ACADEMIC STRUCTURE -->
      <div class="menu-title">Academic Structure</div>
      <a href="departments.html">Departments</a>
      <a href="courses.html">Courses</a>
      <a href="subjects.html">Subjects</a>
      <a href="subject-offerings.html">Subject Offerings</a>
      <a href="enrollments.html">Enrollments</a>
      <hr />

      <!-- ACADEMIC RECORDS -->
      <div class="menu-title">Academic Records</div>
      <a href="parents.html">Parents</a>
      <a href="grades.html">Grades</a>
      <hr />

      <a href="#" class="text-danger" onclick="logout()">Logout</a>
    </div>

    <!-- ■ MAIN CONTENT -->
    <div class="main-content">
      <!-- ■ TOPBAR -->
      <div class="topbar d-flex justify-content-between align-items-center">
        <h5>Grades Management</h5>
      </div>

        <!-- ■ SEARCH -->
        <div class="mb-3">
          <input
            type="text"
            id="gradeSearch"
            class="form-control w-50"
            placeholder="Search grades..."
          />
        </div>

        <!-- ■ TABLE -->
        <table class="table table-bordered">
          <thead class="table-dark">
            <tr>
              <th>Student</th>
              <th>Subject</th>
              <th>Score</th>
              <th>Status</th>
              <th width="150">Actions</th>
            </tr>
          </thead>
          <tbody id="gradeTable"></tbody>
        </table>
      </div>
    </div>

    <!-- ■ ADD / EDIT MODAL -->
    <div class="modal fade" id="gradeModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="gradeModalTitle">Add Grade</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="gradeId" />

            <div class="mb-3">
              <label>Student</label>
              <select id="studentSelect" class="form-select"></select>
            </div>

            <div class="mb-3">
              <label>Subject</label>
              <select id="subjectSelect" class="form-select"></select>
            </div>

            <div class="mb-3">
              <label>Grade Value</label>
              <input type="number" id="gradeValue" class="form-control" />
            </div>

            <div class="mb-3">
              <label>Grading Period</label>
              <select id="gradingPeriod" class="form-select">
                <option value="1">Prelim</option>
                <option value="2">Midterm</option>
                <option value="3">Final</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-primary" onclick="saveGrade()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ■ Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ■ Core Scripts -->
    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/rbac.js"></script>

    <!-- ■ Grades Module -->
    <script src="../js/modules/grades.js"></script>
  </body>
</html>
