<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Teacher Attendance</title>

    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="sidebar">
      <h4 class="text-center py-3">Teacher Panel</h4>
      <a href="teacher-dashboard.html">Dashboard</a>
      <a href="teacher-grades.html">Grades</a>
      <a href="teacher-attendance.html" class="active">Attendance</a>
      <a href="teacher-students.html">My students</a>
      <hr />
      <a href="#" onclick="logout()">Logout</a>
    </div>

    <div class="main-content">
      <div class="topbar">
        <h5>Attendance Management</h5>
      </div>

      <div class="container-fluid mt-4">
        <!-- ✅ Row 1: Class + Date -->
        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label"><strong>Select Class</strong></label>
            <select id="offeringSelect" class="form-select">
              <option value="">-- Select Class --</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label"><strong>Select Date</strong></label>
            <input type="date" id="attendanceDate" class="form-control" />
          </div>
        </div>

        <!-- ✅ Row 2: Buttons -->
        <div class="row mb-4 align-items-end">
          <div class="col-md-3">
            <button class="btn btn-primary w-100" onclick="loadStudents()">
              Load Students
            </button>
          </div>

          <div class="col-md-3">
            <button class="btn btn-success w-100" onclick="startQRScanner()">
              Start QR Scanner
            </button>
          </div>

          <div class="col-md-6">
            <label class="form-label"><strong>Manual QR Entry</strong></label>
            <div class="input-group">
              <input
                type="text"
                id="manualQrInput"
                class="form-control"
                placeholder="Enter QR code value"
              />
              <button class="btn btn-dark" onclick="submitManualQR()">
                Submit
              </button>
            </div>
          </div>
        </div>

        <!-- ✅ QR Scanner Area -->
        <div class="row">
          <div class="col-md-6">
            <div id="qr-reader" style="display: none"></div>
          </div>
        </div>

        <!-- ✅ Students Table -->
        <table class="table table-bordered mt-4">
          <thead class="table-dark">
            <tr>
              <th>Student</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="teacherAttendanceTable"></tbody>
        </table>
      </div>
    </div>

    <!-- ✅ QR LIBRARY -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/modules/teacherAttendance.js"></script>
  </body>
</html>
