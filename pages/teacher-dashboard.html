<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Teacher Dashboard</title>

    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ✅ SIDEBAR -->
    <div class="sidebar">
      <h4 class="text-center py-3">Teacher Panel</h4>

      <a href="teacher-dashboard.html" class="active">Dashboard</a>
      <a href="teacher-grades.html">Grades</a>
      <a href="teacher-attendance.html">Attendance</a>
      <a href="teacher-students.html">My students</a>

      <hr />
      <a href="#" onclick="logout()">Logout</a>
    </div>

    <!-- ✅ MAIN CONTENT -->
    <div class="main-content">
      <div class="topbar">
        <h5>Teacher Dashboard</h5>
      </div>

      <div class="container-fluid mt-4">
        <!-- ✅ PROFILE CARD -->
        <div class="card shadow mb-4 p-4">
          <div class="row">
            <div class="col-md-8">
              <h5>Teacher Information</h5>
              <p><strong>Name:</strong> <span id="teacherName"></span></p>
              <p><strong>Email:</strong> <span id="teacherEmail"></span></p>
              <p>
                <strong>Department:</strong>
                <span id="teacherDepartment"></span>
              </p>
            </div>
            <div class="col-md-4 text-end">
              <h6 class="text-muted">Current Academic Year</h6>
              <span class="badge bg-primary fs-6" id="activeSchoolYear"
                >Loading...</span
              >
            </div>
          </div>
        </div>

        <!-- ✅ STAT CARDS -->
        <div class="row g-4 mb-5" id="teacherCards"></div>

        <!-- ✅ ASSIGNED SUBJECTS -->
        <div class="card shadow p-4">
          <h5>Assigned Subjects</h5>
          <ul class="list-group mt-3" id="subjectList"></ul>
        </div>
      </div>
    </div>

    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/modules/teacherDashboard.js"></script>
  </body>
</html>
