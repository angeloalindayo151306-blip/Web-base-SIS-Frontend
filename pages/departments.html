<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Departments</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Admin CSS -->
    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
  </head>

  <body>
    <!-- ✅ SIDEBAR -->
    <div class="sidebar">
      <h4 class="text-center py-3">SIS Admin</h4>

      <a href="../dashboard.html">Dashboard</a>
      <a href="users.html">User Management</a>

      <hr />

      <div class="menu-title">Academic Structure</div>
      <a href="departments.html" class="active">Departments</a>
      <a href="courses.html">Courses</a>
      <a href="subjects.html">Subjects</a>
      <a href="subject-offerings.html">Subject Offerings</a>
      <a href="enrollments.html">Enrollments</a>

      <hr />

      <div class="menu-title">Academic Records</div>
      <a href="pages/parents.html">Parents</a>
      <a href="pages/grades.html">Grades</a>
      <hr />

      <a href="#" class="text-danger" onclick="logout()">Logout</a>
    </div>

    <!-- ✅ MAIN CONTENT -->
    <div class="main-content">
      <!-- ✅ TOPBAR -->
      <div class="topbar">
        <h5>Departments</h5>
      </div>

      <div class="container-fluid mt-4">
        <!-- ✅ ADD BUTTON -->
        <button class="btn btn-primary mb-3" onclick="openDepartmentModal()">
          + Add Department
        </button>

        <!-- ✅ TABLE -->
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>Department Name</th>
              <th width="150">Actions</th>
            </tr>
          </thead>
          <tbody id="departmentTableBody">
            <!-- JS will populate this -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- ✅ MODAL -->
    <div class="modal fade" id="departmentModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Department</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Department Name</label>
              <input id="departmentName" class="form-control" />
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-primary" onclick="saveDepartment()">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/rbac.js"></script>
    <script src="../js/modules/departments.js"></script>
  </body>
</html>
