<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Admin CSS -->
  <link href="../css/admin.css" rel="stylesheet" />
  <link href="../css/theme.css" rel="stylesheet" />
</head>

<body>

  <!-- ■ SIDEBAR -->
  <div class="sidebar">
    <h4 class="text-center py-3">SIS Admin</h4>

    <a href="../dashboard.html">Dashboard</a>
    <a href="users.html" class="active">User Management</a>

    <hr />

    <div class="menu-title">Academic Structure</div>
    <a href="departments.html">Departments</a>
    <a href="courses.html">Courses</a>
    <a href="subjects.html">Subjects</a>
    <a href="subject-offerings.html">Subject Offerings</a>
    <a href="enrollments.html">Enrollments</a>

    <hr />

    <div class="menu-title">Academic Records</div>
    <a href="parents.html">Parents</a>
    <a href="grades.html">Grades</a>

    <hr />
    <a href="#" class="text-danger" onclick="logout()">Logout</a>
  </div>

  <!-- ■ MAIN CONTENT -->
  <div class="main-content">

    <!-- ■ TOPBAR -->
    <div class="topbar d-flex justify-content-between align-items-center">
      <h5 class="mb-0">User Management</h5>
    </div>

    <!-- ■ CONTENT -->
    <div class="container-fluid mt-4">

      <!-- ■ ACTION BAR -->
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">

        <button class="btn btn-success" onclick="openAddModal()">
          + Add User
        </button>

        <input
          type="text"
          id="userSearch"
          class="form-control"
          placeholder="Search users..."
          style="max-width: 350px;"
        />

      </div>

      <!-- ■ USERS TABLE -->
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle shadow-sm">

          <thead class="table-dark text-center">
            <tr>
              <th class="text-start">Full Name</th>
              <th class="text-start">Email</th>
              <th>Role</th>
              <th width="200">Actions</th>
            </tr>
          </thead>

          <tbody id="userTable"></tbody>

        </table>
      </div>

    </div>
  </div>

  <!-- ■ USER MODAL -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 id="modalTitle" class="modal-title">Add User</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal">
          </button>
        </div>

        <div class="modal-body">

          <input type="hidden" id="userId" />

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="fullName" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Role</label>
            <select id="role" class="form-select">
              <option value="">Select role</option>
              <option value="admin">Admin</option>
              <option value="teacher">Teacher</option>
              <option value="student">Student</option>
              <option value="parent">Parent</option>
            </select>
          </div>

          <div class="mb-3" id="passwordGroup">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" />
          </div>

        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal">
            Cancel
          </button>

          <button
            type="button"
            class="btn btn-primary"
            onclick="saveUser()">
            Save
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- ■ Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ■ Core Scripts -->
  <script src="../js/core/config.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/rbac.js"></script>
  <script src="../js/core/sidebar.js"></script>

  <!-- ■ Users Module -->
  <script src="../js/modules/users.js"></script>

</body>
</html>
