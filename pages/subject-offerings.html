<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Subject Offerings</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
  </head>

  <body>
    <div class="sidebar">
      <h4 class="text-center py-3">SIS Admin</h4>

      <a href="../dashboard.html">Dashboard</a>
      <a href="users.html">User Management</a>

      <hr />

      <div class="menu-title">Academic Structure</div>
      <a href="departments.html">Departments</a>
      <a href="courses.html">Courses</a>
      <a href="subjects.html">Subjects</a>
      <a href="subject-offerings.html" class="active">Subject Offerings</a>
      <a href="enrollments.html">Enrollments</a>

      <hr />

      <div class="menu-title">Academic Records</div>
      <a href="students.html">Students</a>
      <a href="teachers.html">Teachers</a>
      <a href="parents.html">Parents</a>
      <a href="grades.html">Grades</a>
      <a href="attendance.html">Attendance</a>

      <hr />
      <a href="#" class="text-danger" onclick="logout()">Logout</a>
    </div>

    <div class="main-content">
      <div class="topbar">
        <h5>Subject Offerings</h5>
      </div>

      <div class="container-fluid mt-4">
        <button class="btn btn-primary mb-3" onclick="openOfferingModal()">
          + Add Offering
        </button>

        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>Subject</th>
              <th>Teacher</th>
              <th>School Year</th>
              <th>Semester</th>
              <th>Day</th>
              <th>Start Time</th>
              <th>End Time</th>
              <th width="120">Actions</th>
            </tr>
          </thead>
          <tbody id="offeringTable"></tbody>
        </table>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="offeringModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Add Subject Offering</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label>Subject</label>
              <select id="offeringSubject" class="form-select"></select>
            </div>

            <div class="mb-3">
              <label>Teacher</label>
              <select id="offeringTeacher" class="form-select"></select>
            </div>

            <div class="mb-3">
              <label>School Year</label>
              <select id="offeringSchoolYear" class="form-select"></select>
            </div>

            <div class="mb-3">
              <label>Semester</label>
              <select id="offeringSemester" class="form-select">
                <option value="1">1</option>
                <option value="2">2</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Day</label>
              <select id="offeringDays" multiple class="form-select">
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
                <option>Saturday</option>
              </select>
            </div>

            <div class="mb-3">
              <label>Start Time</label>
              <input type="time" id="offeringStart" class="form-control" />
            </div>

            <div class="mb-3">
              <label>End Time</label>
              <input type="time" id="offeringEnd" class="form-control" />
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary" onclick="saveSubjectOffering()">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/modules/subject-Offerings.js"></script>
  </body>
</html>
