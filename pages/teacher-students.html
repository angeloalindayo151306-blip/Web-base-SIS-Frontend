<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>My Students</title>

    <link href="../css/admin.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ✅ SIDEBAR -->
    <div class="sidebar">
      <h4 class="text-center py-3">Teacher Panel</h4>

      <a href="teacher-dashboard.html">Dashboard</a>
      <a href="teacher-grades.html">Grades</a>
      <a href="teacher-attendance.html">Attendance</a>
      <a href="teacher-students.html" class="active">My students</a>

      <hr />
      <a href="#" onclick="logout()">Logout</a>
    </div>

    <!-- ✅ MAIN CONTENT -->
    <div class="main-content">
      <div class="topbar">
        <h5>Students Per Subject</h5>
      </div>

      <div class="container-fluid mt-4">

        <!-- ✅ Class Selector -->
        <div class="mb-3">
          <label class="form-label"><strong>Select Class</strong></label>
          <select id="offeringSelect" class="form-select">
            <option value="">-- Select Class --</option>
          </select>
        </div>
      
        <!-- ✅ Students Table -->
        <table class="table table-bordered mt-3">
          <thead class="table-dark">
            <tr>
              <th>Student Name</th>
              <th>Year Level</th>
              <th>Block</th>
              <th>QR Code</th>
            </tr>
          </thead>
          <tbody id="studentTable"></tbody>
        </table>
      
      </div>

    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/modules/teacherStudents.js"></script>
  </body>
</html>
